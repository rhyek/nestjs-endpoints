packages:
  - 'packages/*'

# pnpm 11: every package with a build script must be decided explicitly.
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  es5-ext: false
  vue-demi: false

# Kubb 5 ships several releases a day, so a current set of its packages rarely
# clears pnpm's one-day release-age gate. Excluded by exact version: bumping
# Kubb means updating these lines alongside the pins.
minimumReleaseAgeExclude:
  - '@kubb/adapter-oas@5.11.0'
  - '@kubb/ast@5.11.0'
  - '@kubb/cli@5.11.0'
  - '@kubb/core@5.11.0'
  - '@kubb/kit@5.11.0'
  - '@kubb/mcp@5.11.0'
  - '@kubb/parser-md@5.11.0'
  - '@kubb/parser-ts@5.11.0'
  - '@kubb/plugin-barrel@5.11.0'
  - '@kubb/plugin-client@5.5.15'
  - '@kubb/plugin-react-query@5.5.3'
  - '@kubb/plugin-ts@5.0.14'
  - '@kubb/plugin-zod@5.4.12'
  - '@kubb/renderer-jsx@5.11.0'
  - '@kubb/studio@5.11.0'
  - kubb@5.11.0
  - unplugin-kubb@5.11.0
