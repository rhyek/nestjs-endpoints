packages:
  - 'packages/*'

# pnpm 11: every package with a build script must be decided explicitly.
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  es5-ext: false
  vue-demi: false
  # Its postinstall writes the coding-agent files into the repository that installs it. This
  # example sits in the library's own repository, so it is declined here; an app of yours sets
  # `nestjs-endpoints: true`. Named by its full spec because it is a `file:` dependency.
  nestjs-endpoints@file:../../packages/nestjs-endpoints: false

# Kubb 5 ships several releases a day, so a current set of its packages rarely
# clears pnpm's one-day release-age gate. Excluded by exact version: bumping
# Kubb means updating these lines alongside the pins.
minimumReleaseAgeExclude:
  - '@kubb/ast@5.20.1'
  - '@kubb/core@5.20.1'
  - '@kubb/kit@5.20.1'
  - '@kubb/parser-ts@5.20.1'
  - '@kubb/plugin-axios@6.0.3'
  - '@kubb/plugin-client@6.0.3'
  - '@kubb/plugin-react-query@5.10.3'
  - '@kubb/plugin-ts@5.5.3'
  - '@kubb/plugin-zod@5.9.3'
  - '@kubb/renderer-jsx@5.20.1'
