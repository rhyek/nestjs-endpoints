packages:
  - 'packages/*'

# pnpm 11: every package with a build script must be decided explicitly.
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  es5-ext: false
  vue-demi: false

# Kubb 5 ships several releases a day, so a current set of its packages rarely
# clears pnpm's one-day release-age gate. Excluded by exact version: bumping
# Kubb means updating these lines alongside the pins.
minimumReleaseAgeExclude:
  - '@kubb/adapter-oas@5.15.4'
  - '@kubb/ast@5.15.4'
  - '@kubb/cli@5.15.4'
  - '@kubb/core@5.15.4'
  - '@kubb/kit@5.15.4'
  - '@kubb/mcp@5.15.4'
  - '@kubb/parser-md@5.15.4'
  - '@kubb/parser-ts@5.15.4'
  - '@kubb/plugin-barrel@5.15.4'
  - '@kubb/plugin-client@5.9.0'
  - '@kubb/plugin-react-query@5.9.0'
  - '@kubb/plugin-ts@5.4.0'
  - '@kubb/plugin-zod@5.8.1'
  - '@kubb/renderer-jsx@5.15.4'
  - '@kubb/studio@5.15.4'
  - kubb@5.15.4
  - unplugin-kubb@5.15.4
