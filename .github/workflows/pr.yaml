name: CI tests

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: asdf-vm/actions/install@v3
        with:
          asdf_branch: v0.15.0
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Build
        run: ./scripts/build.sh
      - name: E2E tests
        run: ./scripts/test.sh
        env:
          FORCE_COLOR: true
      # After the e2e step: the type-aware rules read the library's built types and the clients
      # it generates, and neither is committed. Still runs when the tests failed.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint --max-warnings=0
