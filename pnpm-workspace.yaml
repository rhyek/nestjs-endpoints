packages:
  - 'packages/*'
  - 'packages/test/*'
  # Self-contained, copy-pasteable showcases live under examples/ and
  # are intentionally excluded from this workspace.
  - '!examples/**'

# The compiled library resolves @nestjs/core from the root node_modules while each
# test app resolves its own. pnpm keys a package's physical instance on its resolved
# peers, so if these drift apart the workspace ends up with two @nestjs/core copies
# and DI tokens like HttpAdapterHost stop being identical.
#
# This is the only home pnpm reads: `pnpm.overrides` in package.json is ignored
# from pnpm 10 on.
overrides:
  'reflect-metadata': '0.2.2'
  'rxjs': '7.8.2'

# pnpm 11 replaced `onlyBuiltDependencies` / `ignoredBuiltDependencies` with a
# single `allowBuilds` map. Anything unlisted counts as unreviewed and fails the
# install, so every package with a build script is decided here explicitly: the
# two that compile or fetch a native binary run; the telemetry, donation and
# version-switcher postinstalls do not.
allowBuilds:
  '@swc/core': true
  esbuild: true
  '@scarf/scarf': false
  es5-ext: false
  vue-demi: false
