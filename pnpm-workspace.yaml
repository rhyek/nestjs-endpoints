packages:
  - 'packages/*'
  - 'packages/test/*'
  # Self-contained, copy-pasteable showcases live under examples/ and
  # are intentionally excluded from this workspace.
  - '!examples/**'
# NOTE: dependency overrides live in the root package.json under `pnpm.overrides`.
# An `overrides:` block here is only read by pnpm >= 10, and .tool-versions pins
# pnpm 9 -- one here would be silently ignored.
