packages:
  - 'packages/*'
  - 'packages/test/*'
  # Self-contained, copy-pasteable showcases live under examples/ and
  # are intentionally excluded from this workspace.
  - '!examples/**'
  - 'synced-utils/*'

# The compiled library resolves @nestjs/core from the root node_modules while each
# test app resolves its own. pnpm keys a package's physical instance on its resolved
# peers, so if these drift apart the workspace ends up with two @nestjs/core copies
# and DI tokens like HttpAdapterHost stop being identical.
#
# This is the only home pnpm reads: `pnpm.overrides` in package.json is ignored
# from pnpm 10 on.
overrides:
  'reflect-metadata': '0.2.2'
  'rxjs': '7.8.2'

# pnpm 11 replaced `onlyBuiltDependencies` / `ignoredBuiltDependencies` with a
# single `allowBuilds` map. Anything unlisted counts as unreviewed and fails the
# install, so every package with a build script is decided here explicitly: the
# one that fetches a native binary runs; the telemetry, donation and
# version-switcher postinstalls do not.
allowBuilds:
  esbuild: true
  '@scarf/scarf': false
  es5-ext: false
  vue-demi: false

# Kubb 5 ships several releases a day, so a current set of its packages rarely
# clears pnpm's one-day release-age gate. Excluded by exact version: bumping
# Kubb means updating these lines alongside the pins.
minimumReleaseAgeExclude:
  - '@kubb/adapter-oas@5.15.4'
  - '@kubb/ast@5.15.4'
  - '@kubb/cli@5.15.4'
  - '@kubb/core@5.15.4'
  - '@kubb/kit@5.15.4'
  - '@kubb/mcp@5.15.4'
  - '@kubb/parser-md@5.15.4'
  - '@kubb/parser-ts@5.15.4'
  - '@kubb/plugin-barrel@5.15.4'
  - '@kubb/plugin-client@5.9.0'
  - '@kubb/plugin-react-query@5.9.0'
  - '@kubb/plugin-ts@5.4.0'
  - '@kubb/plugin-zod@5.8.1'
  - '@kubb/renderer-jsx@5.15.4'
  - '@kubb/studio@5.15.4'
  - kubb@5.15.4
  - unplugin-kubb@5.15.4
